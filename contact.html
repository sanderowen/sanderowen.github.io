      <div class="tableRow">
        <section id="content" class="text">

        <form id="contact-form" action="https://formspree.io/f/xgakqpzo" method="post">
          <p class="contact-field">
            <label for="cf-name">Name</label>
            <input type="text" id="cf-name" name="name" required>
          </p>
          <p class="contact-field">
            <label for="cf-email">Email</label>
            <input type="email" id="cf-email" name="email" required>
          </p>
          <p class="contact-field">
            <label for="cf-message">Message</label>
            <textarea id="cf-message" name="message" rows="8" required></textarea>
          </p>
          <!-- Spam trap: hidden from people, filled in by bots -->
          <p class="contact-trap" aria-hidden="true">
            <label>Leave this field empty <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
          </p>
          <input type="hidden" name="_subject" value="New message from sanderowen.com">
          <button type="submit" id="contact-submit">Send</button>
          <p id="contact-status" role="status"></p>
        </form>

        <script>
          (function () {
            var form = document.getElementById('contact-form');
            var status = document.getElementById('contact-status');
            var button = document.getElementById('contact-submit');
            if (!window.fetch) { return; }
            form.addEventListener('submit', function (e) {
              e.preventDefault();
              button.disabled = true;
              status.textContent = 'Sending...';
              fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
              }).then(function (response) {
                if (response.ok) {
                  form.reset();
                  status.textContent = 'Thank you! Your message has been sent.';
                } else {
                  status.textContent = 'Sorry, something went wrong. Please try again in a moment.';
                }
              }).catch(function () {
                status.textContent = 'Sorry, something went wrong. Please try again in a moment.';
              }).then(function () {
                button.disabled = false;
              });
            });
          })();
        </script>

        </section>
